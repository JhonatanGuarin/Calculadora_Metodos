version: '3.8'

services:
  # Servicio de Punto Fijo
  punto-fijo-service:
    build: ./Metodos/punto-fijo-service
    container_name: punto-fijo-service
    ports:
      - "8001:8001"
    networks:
      - metodos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Servicio de Bisección
  biseccion-service:
    build: ./Metodos/biseccion-service
    container_name: biseccion-service
    ports:
      - "8002:8002"
    networks:
      - metodos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Servicio de Newton-Raphson
  newton-raphson-service:
    build: ./Metodos/newton-raphson-service
    container_name: newton-raphson-service
    ports:
      - "8003:8003"
    networks:
      - metodos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Servicio de Secante
  secante-service:
    build: ./Metodos/secante-service
    container_name: secante-service
    ports:
      - "8004:8004"
    networks:
      - metodos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Servicio de Jacobi
  jacobi-service:
    build: ./Metodos/jacobi-service
    container_name: jacobi-service
    ports:
      - "8005:8005"
    networks:
      - metodos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Servicio de Gauss-Seidel
  gauss-seidel-service:
    build: ./Metodos/gauss-seidel-service
    container_name: gauss-seidel-service
    ports:
      - "8006:8006"
    networks:
      - metodos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Servicio de Trapecio
  trapecio-service:
    build: ./Metodos/trapecio-service
    container_name: trapecio-service
    ports:
      - "8007:8007" 
    networks:
      - metodos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Servicio de Simpson
  simpson-service:
    build: ./Metodos/simpson-service
    container_name: simpson-service
    ports:
      - "8008:8008" 
    networks:
      - metodos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  
  # Servicio de Broyden
  broyden-service:
    build: ./Metodos/broyden-service
    container_name: broyden-service
    ports:
      - "8009:8009"
    networks:
      - metodos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Servicio de Romberg
  romberg-service:
    build: ./Metodos/romberg-service
    container_name: romberg-service
    ports:
      - "8010:8010" 
    networks:
      - metodos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Servicio de Euler
  euler-service:
    build: ./Metodos/euler-service
    container_name: euler-service
    ports:
      - "8012:8012" 
    networks:
      - metodos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - punto-fijo-service
      - biseccion-service
      - newton-raphson-service
      - secante-service
      - jacobi-service
      - gauss-seidel-service
      - trapecio-service
      - simpson-service
      - romberg-service
      - broyden-service
      - euler-service
    networks:
      - metodos-network
    environment:
      - PUNTO_FIJO_SERVICE_URL=http://punto-fijo-service:8001
      - BISECCION_SERVICE_URL=http://biseccion-service:8002
      - NEWTON_RAPHSON_SERVICE_URL=http://newton-raphson-service:8003
      - SECANTE_SERVICE_URL=http://secante-service:8004
      - JACOBI_SERVICE_URL=http://jacobi-service:8005
      - GAUSS_SEIDEL_SERVICE_URL=http://gauss-seidel-service:8006
      - TRAPECIO_SERVICE_URL=http://trapecio-service:8007
      - SIMPSON_SERVICE_URL=http://simpson-service:8008
      - ROMBERG_SERVICE_URL=http://romberg-service:8010
      - BROYDEN_SERVICE_URL=http://broyden-service:8009
      - EULER_SERVICE_URL=http://euler-service:8012
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - metodos-network
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api

networks:
  metodos-network:
    driver: bridge